openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Product catalog operations
  - name: orders
    description: Order tracking operations
  - name: admin
    description: Admin / owner operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List shop categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products with filtering, sorting, and pagination
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, price_asc, price_desc, rating, newest]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          schema:
            type: number
            default: 12
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResult"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [catalog]
      summary: List featured products for the homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/best-sellers:
    get:
      operationId: listBestSellerProducts
      tags: [catalog]
      summary: List best-selling products
      responses:
        "200":
          description: Best-selling products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/new-arrivals:
    get:
      operationId: listNewArrivalProducts
      tags: [catalog]
      summary: List newly arrived products
      responses:
        "200":
          description: New arrival products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a single product with details and reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
  /orders/payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [orders]
      summary: List enabled payment methods for checkout
      responses:
        "200":
          description: List of enabled payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order from checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderConfirmation"

  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [orders]
      summary: Subscribe an email to the newsletter (footer signup form)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscribeInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscribeResponse"
        "400":
          description: Invalid email

  /newsletter/unsubscribe:
    post:
      operationId: unsubscribeNewsletter
      tags: [orders]
      summary: Remove an email from the newsletter (unsubscribe link)
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscribeResponse"
        "400":
          description: Invalid email

  /orders/{orderNumber}/track:
    get:
      operationId: trackOrder
      tags: [orders]
      summary: Look up order tracking status by order number
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order tracking result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTracking"
        "404":
          description: Order not found

  # ── Admin endpoints ──────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard summary stats
      responses:
        "200":
          description: Aggregated store stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: List all products (admin view, full detail)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Paginated admin product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductListResult"
    post:
      operationId: adminCreateProduct
      tags: [admin]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"

  /admin/images:
    get:
      operationId: adminListImages
      tags: [admin]
      summary: List stored product image groups with product usage (admin view)
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stored image objects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImageListResult"
    delete:
      operationId: adminDeleteImage
      tags: [admin]
      summary: Delete a complete stored product image group
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: confirmUsed
          in: query
          description: Required when the image is currently referenced by one or more products.
          schema:
            type: boolean
      responses:
        "200":
          description: Image deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeleteImageResult"
        "400":
          description: Invalid storage path

  /admin/products/{id}:
    put:
      operationId: adminUpdateProduct
      tags: [admin]
      summary: Update an existing product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "404":
          description: Product not found
    delete:
      operationId: adminDeleteProduct
      tags: [admin]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "404":
          description: Product not found

  /admin/categories:
    get:
      operationId: adminListCategories
      tags: [admin]
      summary: List all categories (admin view)
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: adminCreateCategory
      tags: [admin]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /admin/categories/{id}:
    put:
      operationId: adminUpdateCategory
      tags: [admin]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          description: Category not found
    delete:
      operationId: adminDeleteCategory
      tags: [admin]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "404":
          description: Category not found

  /admin/staff:
    get:
      operationId: adminListStaff
      tags: [admin]
      summary: List all admin staff accounts (admin only)
      responses:
        "200":
          description: List of staff accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminStaff"
    post:
      operationId: adminCreateStaff
      tags: [admin]
      summary: Create a new admin staff account (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffInput"
      responses:
        "201":
          description: Created staff account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaff"
        "409":
          description: Username already exists

  /admin/staff/{id}:
    patch:
      operationId: adminUpdateStaff
      tags: [admin]
      summary: Update a staff account's role, active status, and/or password (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffUpdate"
      responses:
        "200":
          description: Updated staff account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaff"
        "404":
          description: Staff account not found
    delete:
      operationId: adminDeleteStaff
      tags: [admin]
      summary: Delete a staff account (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        "404":
          description: Staff account not found

  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: List all orders (admin view)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Paginated admin order list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderListResult"

  /admin/orders/{id}/status:
    put:
      operationId: adminUpdateOrderStatus
      tags: [admin]
      summary: Update order status (auto-advances tracking steps)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "404":
          description: Order not found

  /admin/orders/{id}:
    delete:
      operationId: adminDeleteOrder
      tags: [admin]
      summary: Delete an order (admin or manager)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDeleteOrderResponse"
        "404":
          description: Order not found

  /admin/newsletter/subscribers:
    get:
      operationId: adminListNewsletterSubscribers
      tags: [admin]
      summary: List newsletter subscribers (admin)
      responses:
        "200":
          description: List of newsletter subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminNewsletterSubscriber"

  /admin/newsletter/subscribers/{id}:
    delete:
      operationId: adminDeleteNewsletterSubscriber
      tags: [admin]
      summary: Remove a newsletter subscriber (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /admin/settings/payment-methods:
    get:
      operationId: adminListPaymentMethods
      tags: [admin]
      summary: List all payment methods (admin)
      responses:
        "200":
          description: List of payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"

  /admin/settings/payment-methods/{id}:
    put:
      operationId: adminUpdatePaymentMethod
      tags: [admin]
      summary: Enable or disable a payment method
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodUpdate"
      responses:
        "200":
          description: Updated payment method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "404":
          description: Payment method not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      required: [id, name, slug, imageUrl, productCount]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        imageUrl: { type: string }
        productCount: { type: number }
    AdminStaff:
      type: object
      required: [id, username, email, role, active, createdAt, lastLoginAt]
      properties:
        id: { type: string }
        username: { type: string }
        email:
          type: string
          nullable: true
          description: Google account email used for "Sign in with Google" on the admin dashboard, independent of username.
        role: { type: string, enum: [admin, manager, supervisor] }
        active: { type: boolean }
        createdAt: { type: string }
        lastLoginAt: { type: string, nullable: true }
    AdminStaffInput:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 200 }
        role: { type: string, enum: [admin, manager, supervisor] }
        email:
          type: string
          description: Optional Google account email to enable "Sign in with Google" for this account.
    AdminStaffUpdate:
      type: object
      properties:
        role: { type: string, enum: [admin, manager, supervisor] }
        active: { type: boolean }
        password: { type: string, minLength: 8, maxLength: 200 }
        email:
          type: string
          description: Optional Google account email to enable "Sign in with Google" for this account.
    Product:
      type: object
      required:
        [
          id,
          slug,
          name,
          shortDescription,
          price,
          currency,
          imageUrl,
          categorySlug,
          categoryName,
          rating,
          reviewCount,
          inStock,
          stockQuantity,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        shortDescription: { type: string }
        price: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        currency: { type: string }
        imageUrl: { type: string }
        galleryUrls:
          type: array
          items: { type: string }
        thumbUrl: { type: ["string", "null"] }
        mediumUrl: { type: ["string", "null"] }
        largeUrl: { type: ["string", "null"] }
        lqip: { type: ["string", "null"] }
        imageAlt: { type: ["string", "null"] }
        categorySlug: { type: string }
        categoryName: { type: string }
        rating: { type: number }
        reviewCount: { type: number }
        inStock: { type: boolean }
        stockQuantity: { type: number }
        badge:
          type: ["string", "null"]
          enum: [new, bestseller, sale, null]
    ProductListResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }
    Review:
      type: object
      required: [id, author, rating, comment, date]
      properties:
        id: { type: string }
        author: { type: string }
        rating: { type: number }
        comment: { type: string }
        date: { type: string }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [description, features, reviews, relatedProductIds]
          properties:
            description: { type: string }
            features:
              type: array
              items: { type: string }
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/Review"
            relatedProductIds:
              type: array
              items: { type: string }
    OrderTrackingStep:
      type: object
      required: [label, completed, date]
      properties:
        label: { type: string }
        completed: { type: boolean }
        date: { type: ["string", "null"] }
    OrderTracking:
      type: object
      required: [orderNumber, status, estimatedDelivery, steps, subtotal, shippingFee, total]
      properties:
        orderNumber: { type: string }
        status: { type: string }
        estimatedDelivery: { type: string }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OrderTrackingStep"
        items:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal: { type: number }
        shippingFee: { type: number }
        total: { type: number }

    PaymentMethod:
      type: object
      required: [id, key, label, enabled]
      properties:
        id: { type: string }
        key: { type: string }
        label: { type: string }
        description: { type: ["string", "null"] }
        enabled: { type: boolean }

    PaymentMethodUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    OrderItem:
      type: object
      required: [productId, name, quantity, price]
      properties:
        productId: { type: string }
        name: { type: string }
        quantity: { type: number }
        price: { type: number }

    CreateOrderInput:
      type: object
      required: [customerName, customerPhone, paymentMethodKey, items]
      properties:
        customerName: { type: string }
        customerPhone: { type: string }
        paymentMethodKey: { type: string }
        shippingAddress: { type: string }
        shippingFee: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderConfirmation:
      type: object
      required: [orderNumber, estimatedDelivery]
      properties:
        orderNumber: { type: string }
        estimatedDelivery: { type: string }

    NewsletterSubscribeInput:
      type: object
      required: [email]
      properties:
        email: { type: string }

    NewsletterSubscribeResponse:
      type: object
      required: [email]
      properties:
        email: { type: string }

    AdminNewsletterSubscriber:
      type: object
      required: [id, email, subscribedAt]
      properties:
        id: { type: string }
        email: { type: string }
        subscribedAt: { type: string }

    # ── Admin schemas ─────────────────────────────────────────────────────────
    AdminStats:
      type: object
      required: [totalProducts, totalCategories, totalOrders, inStockProducts, outOfStockProducts, storageUsedBytes, storageLimitBytes, storageFileCount]
      properties:
        totalProducts: { type: number }
        totalCategories: { type: number }
        totalOrders: { type: number }
        inStockProducts: { type: number }
        outOfStockProducts: { type: number }
        storageUsedBytes: { type: number }
        storageLimitBytes: { type: number }
        storageFileCount: { type: number }

    AdminImageProduct:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    AdminImage:
      type: object
      required: [path, name, size, mimeType, createdAt, updatedAt, publicUrl, variantCount, used, products]
      properties:
        path: { type: string }
        name: { type: string }
        size: { type: number }
        mimeType: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
        updatedAt: { type: ["string", "null"] }
        publicUrl: { type: string }
        variantCount: { type: number }
        used: { type: boolean }
        products:
          type: array
          items:
            $ref: "#/components/schemas/AdminImageProduct"

    AdminImageListResult:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminImage"
        total: { type: number }

    AdminDeleteImageResult:
      type: object
      required: [success, path, deletedCount]
      properties:
        success: { type: boolean }
        path: { type: string }
        deletedCount: { type: number }

    AdminProduct:
      type: object
      required: [id, slug, name, shortDescription, description, price, currency, imageUrl, categoryId, categoryName, rating, reviewCount, inStock, stockQuantity, createdAt]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        shortDescription: { type: string }
        description: { type: string }
        price: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        currency: { type: string }
        imageUrl: { type: string }
        galleryUrls:
          type: array
          items: { type: string }
        thumbUrl: { type: ["string", "null"] }
        mediumUrl: { type: ["string", "null"] }
        largeUrl: { type: ["string", "null"] }
        lqip: { type: ["string", "null"] }
        imageAlt: { type: ["string", "null"] }
        categoryId: { type: string }
        categoryName: { type: string }
        rating: { type: number }
        reviewCount: { type: number }
        inStock: { type: boolean }
        stockQuantity: { type: number }
        badge: { type: ["string", "null"] }
        features:
          type: array
          items: { type: string }
        createdAt: { type: string }

    AdminProductListResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminProduct"
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }

    ProductInput:
      type: object
      required: [slug, name, shortDescription, description, price, currency, imageUrl, categoryId, stockQuantity]
      properties:
        slug: { type: string }
        name: { type: string }
        shortDescription: { type: string }
