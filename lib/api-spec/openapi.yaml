openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Product catalog operations
  - name: orders
    description: Order tracking operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List shop categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products with filtering, sorting, and pagination
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, price_asc, price_desc, rating, newest]
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: page
          in: query
          schema:
            type: number
            default: 1
        - name: pageSize
          in: query
          schema:
            type: number
            default: 12
      responses:
        "200":
          description: Paginated product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResult"
  /products/featured:
    get:
      operationId: listFeaturedProducts
      tags: [catalog]
      summary: List featured products for the homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/best-sellers:
    get:
      operationId: listBestSellerProducts
      tags: [catalog]
      summary: List best-selling products
      responses:
        "200":
          description: Best-selling products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/new-arrivals:
    get:
      operationId: listNewArrivalProducts
      tags: [catalog]
      summary: List newly arrived products
      responses:
        "200":
          description: New arrival products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a single product with details and reviews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
  /orders/{orderNumber}/track:
    get:
      operationId: trackOrder
      tags: [orders]
      summary: Look up order tracking status by order number
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order tracking result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTracking"
        "404":
          description: Order not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Category:
      type: object
      required: [id, name, slug, imageUrl, productCount]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        imageUrl: { type: string }
        productCount: { type: number }
    Product:
      type: object
      required:
        [
          id,
          slug,
          name,
          shortDescription,
          price,
          currency,
          imageUrl,
          categorySlug,
          categoryName,
          rating,
          reviewCount,
          inStock,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        shortDescription: { type: string }
        price: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        currency: { type: string }
        imageUrl: { type: string }
        galleryUrls:
          type: array
          items: { type: string }
        categorySlug: { type: string }
        categoryName: { type: string }
        rating: { type: number }
        reviewCount: { type: number }
        inStock: { type: boolean }
        badge:
          type: ["string", "null"]
          enum: [new, bestseller, sale, null]
    ProductListResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }
    Review:
      type: object
      required: [id, author, rating, comment, date]
      properties:
        id: { type: string }
        author: { type: string }
        rating: { type: number }
        comment: { type: string }
        date: { type: string }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [description, features, reviews, relatedProductIds]
          properties:
            description: { type: string }
            features:
              type: array
              items: { type: string }
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/Review"
            relatedProductIds:
              type: array
              items: { type: string }
    OrderTrackingStep:
      type: object
      required: [label, completed, date]
      properties:
        label: { type: string }
        completed: { type: boolean }
        date: { type: ["string", "null"] }
    OrderTracking:
      type: object
      required: [orderNumber, status, estimatedDelivery, steps]
      properties:
        orderNumber: { type: string }
        status: { type: string }
        estimatedDelivery: { type: string }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OrderTrackingStep"

