kind = "web"
previewPath = "/admin-dashboard/"
title = "Cloud Toys Admin"
description = "Owner dashboard for Cloud Toys — lets the store owner manage products, categories, view orders, and track revenue from a single private web app."
version = "1.0.0"
id = "artifacts/admin-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/admin-dashboard/" ]
localPort = 22133

[services.development]
run = "pnpm --filter @workspace/admin-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/admin-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/admin-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22133"
BASE_PATH = "/admin-dashboard/"
